spring.application.name=thriftSystem
server.port=8080


#spring.data.mongodb.uri=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@localhost:27017/${MONGO_DATABASE}?authSource=admin
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=${MONGO_DATABASE}
spring.data.mongodb.uuid-representation=standard
spring.data.mongodb.auto-index-creation=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET}
#app.jwt.expiration=${JWT_EXPIRATION}
app.jwt.expiration=86400000

spring.docker.compose.enabled=false
spring.data.mongodb.ssl.enabled=${MONGO_SSL_ENABLED:true}
spring.data.mongodb.ssl.invalid-hostname-allowed=true


